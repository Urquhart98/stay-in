<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8dece" />
    <title>Page not found</title>
    <link rel="icon" type="image/png" href="assets/images/stay-in-favicon.png" />
    <style>
      :root { --ink: #312d27; --muted: #70675c; --accent: #8a755b; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(130deg, #f9f5ed 0%, #ede3d5 58%, #dbc9b2 100%);
      }
      main { width: min(100% - 48px, 760px); padding: 56px 0; }
      .eyebrow { margin: 0 0 20px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; }
      h1 { max-width: 650px; margin: 0; font-size: clamp(3rem, 7vw, 6.5rem); font-weight: 650; line-height: .91; letter-spacing: -.07em; }
      p { max-width: 460px; margin: 30px 0 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.55; }
      .mark { display: flex; gap: 8px; margin-top: 46px; }
      .mark span { width: 11px; height: 11px; background: var(--ink); }
      .mark span:nth-child(2) { opacity: .45; }
      .mark span:nth-child(3) { opacity: .14; }
      #site-loader { position: fixed; z-index: 9999; inset: 0; display: grid; place-items: center; overflow: hidden; background: #e8dece; transition: opacity .5s ease, visibility .5s step-end; }
      #site-loader span { position: relative; display: block; width: fit-content; color: #3b3329; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: clamp(1.35rem, 3.2vw, 2.65rem); font-weight: 650; line-height: .96; letter-spacing: -.065em; text-shadow: 0 1px 0 rgba(255,255,255,.72), 0 6px 12px rgba(58,48,35,.12); animation: logo-spin 1.3s cubic-bezier(.25,.7,.25,1) both; }
      #site-loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes logo-spin { 0% { opacity: 0; filter: blur(3px); transform: perspective(900px) rotateY(-15deg) translateY(12px) scale(.97); } 38% { opacity: 1; filter: blur(0); } 72% { transform: perspective(900px) rotateY(3deg) translateY(0) scale(1.008); } 100% { transform: perspective(900px) rotateY(0) translateY(0) scale(1); } }
    </style>
  </head>
  <body>
    <div id="site-loader" aria-hidden="true"><span>stay-in.co.uk</span></div>
    <main>
      <p class="eyebrow">stay-in</p>
      <h1>Oops! Looks like we can't find this page!</h1>
      <p>Please contact your Host!</p>
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
    </main>
    <script>window.setTimeout(() => document.querySelector('#site-loader').classList.add('hide'), 1500);</script>
  </body>
</html>
